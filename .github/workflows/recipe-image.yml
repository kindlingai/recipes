# One recipe's image (its Dockerfile: the engine at engine.commit, the front end, the loader and the launcher), built on a
# GitHub-hosted arm64 runner. recipes.yml calls this once per recipe whose kindling.json has a build object. Pull
# requests build and smoke-test it; main and the recipe's tags also push it to the recipe's image (kindling.json image,
# the name it had as its own repo): latest and main follow main's head, a tag <id>/<name> pushes <name>, every image
# gets sha-<commit>. When gr8 has published an image of engine.commit, the binaries come from it and nothing compiles;
# otherwise they are built, with the compile cache kept between runs.
name: Recipe image

on:
  workflow_call:
    inputs:
      dir:
        description: The recipe folder, <model>/<hardware>/<count>x/<variant>
        type: string
        required: true
      image:
        description: kindling.json image, without a tag
        type: string
        required: true
      id:
        description: kindling.json id, the prefix of the recipe's tags
        type: string
        required: true
      nvcc_cache:
        description: kindling.json build.nvcc_cache, the compile cache's id; empty for a Dockerfile without one
        type: string
        default: ''
      engine:
        description: "auto: gr8's published binaries when gr8 has an image of engine.commit, else a build. build: always build"
        type: string
        default: auto

permissions:
  contents: read

jobs:
  image:
    name: ${{ inputs.id }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    # a cold build compiles the Rust front end (fat LTO), XGrammar and one engine (one long nvcc)
    timeout-minutes: 120
    concurrency:
      group: image-${{ inputs.id }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      # the compile cache is saved by pushes to main only: a copy saved from a tag or a pull request is read by no other ref
      NVCC_SAVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.nvcc_cache != '' }}
      NVCC_KEY: gr8-nvcc-${{ inputs.nvcc_cache }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: The engine pin
        id: pin
        run: |
          read -r repo commit < <(jq -r '.engine | "\(.repo) \(.commit)"' "${{ inputs.dir }}/kindling.json")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: The engine's source, at the pin
        # what tools/engine.sh does locally: the Dockerfile COPYs from <recipe>/gr8
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ${{ inputs.dir }}/gr8
      - name: Free disk space
        # the CUDA devel image is about 10 GB unpacked
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: The engine, from gr8's image or a build
        # gr8's CI publishes ghcr.io/kindlingai/gr8:sha-<commit> from its main. When that image exists for the pinned
        # commit (its revision label says so) and the Dockerfile takes it (ARG ENGINE_SRC), the binaries come from it,
        # pinned by digest, and nothing compiles. A commit off gr8's main has no image and is built here. Checked before
        # the login, so anonymously.
        id: engine
        env:
          WANT: ${{ inputs.engine }}
          PIN: ${{ steps.pin.outputs.commit }}
          DOCKERFILE: ${{ inputs.dir }}/Dockerfile
        run: |
          ref=ghcr.io/kindlingai/gr8:sha-${PIN:0:7}
          src=build why="gr8 has no image of $PIN"
          if ! grep -q '^ARG ENGINE_SRC' "$DOCKERFILE"; then
            why="the Dockerfile always builds the engine"
          elif [ "$WANT" = build ]; then
            why="the engine input asks for a build"
          elif manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2> /dev/null); then
            image=ghcr.io/kindlingai/gr8@$(jq -r .digest <<< "$manifest")
            rev=$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' \
              | jq -r '(.config // .["linux/arm64"].config).Labels["org.opencontainers.image.revision"]')
            if [ "$rev" = "$PIN" ]; then src=image why="$ref is $image"
            else why="$ref is gr8 at $rev, not $PIN"; fi
          fi
          echo "engine: $src ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "src=$src"
            # the layer cache: one scope a recipe and path, so a run on one does not drop the other's layers
            if [ "$src" = image ]; then echo "scope=${{ inputs.id }}-gr8bins"; else echo "scope=${{ inputs.id }}"; fi
            echo 'args<<EOF'
            if grep -q '^ARG ENGINE_SRC' "$DOCKERFILE"; then echo "ENGINE_SRC=$src"; fi
            if [ "$src" = image ]; then echo "GR8_IMAGE=$image"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      # The compile cache (gr8/docs/BUILD-CACHE.md), on the build path only and for a Dockerfile with the cache mount:
      # kept in the Actions cache between runs and loaded into the builder by the cache dance. Every run restores the
      # newest copy; pushes to main save one per engine commit. The steps after the build run in reverse: the cache dance
      # copies the mount out, then actions/cache saves it.
      - name: Restore the compile cache, and save it after the build
        id: nvcc-save
        if: steps.engine.outputs.src == 'build' && env.NVCC_SAVE == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ env.NVCC_KEY }}-${{ hashFiles(format('{0}/Dockerfile', inputs.dir)) }}-${{ steps.pin.outputs.commit }}
          restore-keys: ${{ env.NVCC_KEY }}-
      - name: Restore the compile cache
        if: steps.engine.outputs.src == 'build' && inputs.nvcc_cache != '' && env.NVCC_SAVE != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/nvcc-cache
          key: ${{ env.NVCC_KEY }}-${{ hashFiles(format('{0}/Dockerfile', inputs.dir)) }}-${{ steps.pin.outputs.commit }}
          restore-keys: ${{ env.NVCC_KEY }}-
      - name: Put the compile cache in the builder's cache mount
        if: steps.engine.outputs.src == 'build' && inputs.nvcc_cache != ''
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723  # v3.4.0
        with:
          cache-map: '{"${{ runner.temp }}/nvcc-cache": {"target": "/var/cache/gr8-nvcc", "id": "${{ env.NVCC_KEY }}"}}'
          scratch-dir: ${{ runner.temp }}/nvcc-dance
          # copy it back out only to save it: on main, when no copy has this key yet
          skip-extraction: ${{ env.NVCC_SAVE != 'true' || steps.nvcc-save.outputs.cache-hit == 'true' }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Is this commit still main's head?
        # a run that finishes after a newer commit's run pushes only its sha tag, so latest never moves back
        id: head
        run: |
          head=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then head=true; fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: The recipe's tag, without its id/ prefix
        id: tag
        if: startsWith(github.ref, format('refs/tags/{0}/', inputs.id))
        run: echo "name=${GITHUB_REF#refs/tags/${{ inputs.id }}/}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ inputs.image }}
          # latest comes only from the raw rule below (main's head): the action's default flavor would also tag latest
          # on every git tag push
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.head }}
            type=ref,event=branch,enable=${{ steps.head.outputs.head }}
            type=raw,value=${{ steps.tag.outputs.name }},enable=${{ steps.tag.outputs.name != '' }}
            type=sha
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ${{ inputs.dir }}
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          build-args: ${{ steps.engine.outputs.args }}
          cache-from: |
            type=gha,scope=${{ inputs.id }}
            type=gha,scope=${{ inputs.id }}-gr8bins
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', steps.engine.outputs.scope) || '' }}
      - name: Smoke test (no GPU)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        working-directory: ${{ inputs.dir }}
        run: ./smoke.sh "$(echo "$TAGS" | head -1)"
      - name: Push
        id: push
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$(echo "$TAGS" | head -1)" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
