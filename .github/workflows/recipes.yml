# Checks for the recipes a change touches (tools/changed_recipes.py picks them):
#   check  every touched recipe's pins agree (tools/check_pin.py), its compose.yaml parses with .env.example, the
#          engine image it pins exists, and it meets the recipe standard (tools/lint_recipe.py; any Dockerfile is a
#          hard error, other findings are warn-only until the conversions of #2 land). A change to tools/, schema/,
#          template/, hardware.json or this workflow checks every recipe.
name: Recipes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recipe:
        description: A recipe id (kindling.json id), or all
        default: all

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      check: ${{ steps.pick.outputs.check }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - id: pick
        env:
          RECIPE: ${{ inputs.recipe }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*) args=(--base "origin/$BASE_REF") ;;
            push:*)
              # a new branch, or a force push whose old head is gone: everything
              if [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
                args=(--all)
              else args=(--base "$BEFORE"); fi ;;
            workflow_dispatch:*) if [ "$RECIPE" = all ]; then args=(--all); else args=(--id "$RECIPE"); fi ;;
          esac
          python3 tools/changed_recipes.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: select
    if: needs.select.outputs.check != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Pins agree in kindling.json and compose.yaml
        env:
          DIRS: ${{ needs.select.outputs.check }}
        run: jq -r '.[]' <<< "$DIRS" | xargs python3 tools/check_pin.py
      - name: compose.yaml parses with .env.example
        env:
          DIRS: ${{ needs.select.outputs.check }}
        run: |
          for d in $(jq -r '.[]' <<< "$DIRS"); do
            [ -f "$d/compose.yaml" ] || continue
            if [ -f "$d/.env.example" ]; then cp "$d/.env.example" "$d/.env"; else touch "$d/.env"; fi
            (cd "$d" && docker compose config --quiet) || { echo "::error file=$d/compose.yaml::docker compose config failed"; exit 1; }
            echo "$d: compose ok"
          done
      - name: Lint against the recipe standard
        # Hard-fails on any Dockerfile; other findings are warn-only until every conversion of #2 lands, then add --strict here (the last checkbox of #3).
        env:
          DIRS: ${{ needs.select.outputs.check }}
        run: jq -r '.[]' <<< "$DIRS" | xargs python3 tools/lint_recipe.py
      - name: The engine image each recipe pins exists
        env:
          DIRS: ${{ needs.select.outputs.check }}
        run: |
          for d in $(jq -r '.[]' <<< "$DIRS"); do
            img=$(jq -r '.engine // {} | select(.pin == "image" and (.image_digest // "") != "") | (.image | split(":")[0]) + "@" + .image_digest' "$d/kindling.json")
            [ -n "$img" ] || continue
            docker manifest inspect "$img" > /dev/null || { echo "::error file=$d/kindling.json::$img does not exist"; exit 1; }
            echo "$d: $img exists"
          done
