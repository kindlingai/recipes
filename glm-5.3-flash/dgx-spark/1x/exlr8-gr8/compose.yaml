# GLM-5.3-Flash on one DGX Spark (GB10): gr8's published image, pinned by tag and digest, with this recipe's .env
# and read-only launcher/preset mounts. No engine is compiled here and there is no Dockerfile. Serves the OpenAI API on
# port 8100 (host network).
#
#   cp .env.example .env
#   docker compose up -d                                      # pulls gr8, fetches the model (~87 GB), serves on :8100
#   docker compose logs -f                                    # ready when it prints that the cluster serves
#   docker compose exec gr8 /opt/glm53f-1x/bin/gr8 glm53f smoke
#   docker compose down
#
# RULE (gr8's): no option default lives here. The launcher in the image (plus knobs.sh for TUNE/MENTAT) owns every
# default, and .env carries this recipe's settings. The only values set below are the container's own paths.
name: glm53f-1x-spark
services:
  gr8:
    # The engine pin: kindlingai/gr8 v1.2.0 (ab2eb95f); kindling.json "engine" names the same digest.
    image: ${GR8_IMAGE:-ghcr.io/kindlingai/gr8:v1.2.0@sha256:3de05aab8cda21fd5d6b4af89ccdba6ff5abdbd704729601fd348fa638ade9fd}
    container_name: glm53f-1x-spark
    entrypoint: ["/opt/glm53f-1x/entrypoint.sh"]
    # The recipe's settings (TUNE, CAP, MAX_MODEL_LEN, DFLASH, MENTAT, MODEL, ...) come from .env (.env.example).
    env_file:
      - path: .env
        required: false
    environment:
      # The container's own paths (the volumes below, the image's python and front end). Set here so a path meant for
      # a bare-metal box in .env cannot point the launcher somewhere that does not exist in the container.
      - GR8_WORK_DIR=/var/lib/gr8/home
      - MODEL_CACHE=/var/lib/gr8/cache
      - PY=/usr/bin/python3
      - FRONT_BIN=/opt/gr8/bin/g6front-rs
    # The front end (8100) and the supervisor's and engine's control ports (7340, 7341) on the box's own interfaces.
    network_mode: host
    # The launcher refuses to start next to another g6m4 on the box, and sees one started outside the container only in
    # the host's process list.
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      # Pinned host buffers.
      memlock: -1
      # A crash must not dump core: the engine maps ~90 GB, and the dumping thread holds the NVIDIA driver's lock the
      # whole time it writes, which can leave the box unreachable until a power cycle.
      core: 0
    # The engine runs with no more rights than it needs: the image's uid 1000, no capabilities but IPC_LOCK (pinned
    # memory), no privilege escalation, a read-only image with a private /tmp.
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    # Under memory pressure the kernel ends the engine before sshd or the rest of the box.
    oom_score_adj: 1000
    # tini as PID 1: it forwards docker's SIGTERM to the launcher and reaps the engine and its shims.
    init: true
    # Long enough for the supervisor to quit the engine cleanly. Raise GR8_STOP_GRACE in .env if needed.
    stop_grace_period: ${GR8_STOP_GRACE:-30s}
    volumes:
      # The model (TP=1 part, ~87 GB with drafter) and the prompt cache (/var/lib/gr8/cache/prompts, up to 64 GB,
      # kv-store.yaml). Unset, a named volume; set GR8_CACHE to a host directory owned by uid 1000 to keep it outside
      # docker.
      - ${GR8_CACHE:-cache}:/var/lib/gr8/cache
      # Logs and state: out/supervisor.log, g6m4.r0.err, shim.log, front.log. Unset, a named volume.
      - ${GR8_HOME:-home}:/var/lib/gr8/home
      # Recipe launcher scripts and KV store config, bind-mounted read-only so the running container cannot modify them.
      - ./entrypoint.sh:/opt/glm53f-1x/entrypoint.sh:ro
      - ./knobs.sh:/opt/glm53f-1x/knobs.sh:ro
      - ./bin/gr8:/opt/glm53f-1x/bin/gr8:ro
      - ./kv-store.yaml:/etc/gr8/kv-store.yaml:ro
    healthcheck:
      test: ["CMD", "/opt/glm53f-1x/bin/gr8", "glm53f", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60m
    restart: on-failure

volumes:
  cache:
  home:
