# Qwen3.8-Flash-Next on one RTX 5090 (Blackwell sm_120a, hybrid GPU + host RAM): gr8's published linux/amd64 image,
# pinned by tag and digest, with this recipe's .env. No engine is compiled here: the image ships g6m4_qw38 with
# single-GPU Strata hot-expert caching and AVX-512 CPU MoE offload. Serves the OpenAI API on port 8100.
#
#   cp .env.example .env
#   docker compose up -d                                  # the first boot fetches bit300 (~164 GB) into GR8_CACHE
#   docker compose logs -f                                # the supervisor
#   docker compose exec gr8 /opt/gr8/gr8 qw38 smoke       # once it serves
#   docker compose exec gr8 /opt/gr8/gr8 qw38 down        # stops the engine cleanly
#
# RULE (gr8's): no option default lives here. The launcher in the image owns every default, and .env carries this
# recipe's settings. The only values set below are the container's own paths.
name: qw38-1x-rtx5090
services:
  gr8:
    # The engine pin: kindlingai/gr8 v1.3.0 (pending kindlingai/gr8#629 linux/amd64 sm_120a publish; append
    # @sha256:<digest> once released; kindling.json "engine" names the same pin).
    image: ${GR8_IMAGE:-ghcr.io/kindlingai/gr8:v1.3.0}
    container_name: qw38-1x-rtx5090
    # The launcher's options, from .env. Optional: options can also come on the command line of `run`.
    env_file:
      - path: .env
        required: false
    environment:
      # The container's own paths (the volumes below, the image's python and front end). Set here so a MODEL_CACHE,
      # GR8_WORK_DIR, PY or FRONT_BIN line in .env, meant for a bare-metal box, cannot point the launcher at a path that
      # does not exist in the container.
      - GR8_WORK_DIR=/var/lib/gr8/home
      - MODEL_CACHE=/var/lib/gr8/cache
      - PY=/usr/bin/python3
      - FRONT_BIN=/opt/gr8/bin/g6front-rs
    # The supervisor control port (7340), S2 control port (7341) and OpenAI API (8100) are host ports.
    network_mode: host
    # The launcher refuses to start next to another g6m4 on the box, and sees one started outside the container only
    # in the host's process list.
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      # Pinned host buffers (~46.7 GB pinned DDR5 for routed K3 experts + async PLE staging).
      memlock: -1
      # A crash must not dump core. The process maps tens of GB of host and GPU memory, and the dumping thread holds
      # the NVIDIA driver's lock the whole time it writes, which can leave the box unreachable until a power cycle.
      core: 0
    # The engine runs with no more rights than it needs: the image's uid 1000, no capabilities but IPC_LOCK (pinned
    # memory), no privilege escalation, a read-only image with a private /tmp.
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    # Under memory pressure the kernel ends the engine before sshd or the rest of the box.
    oom_score_adj: 1000
    # tini as PID 1: it forwards docker's SIGTERM to the launcher and reaps the engine and the shims.
    init: true
    # SIGTERM makes the supervisor quit its engine (10 s), then signal it (5 s more). With a persistent KV_STORE
    # (persist=on), set GR8_STOP_GRACE=150s so docker does not kill the engine while flushing sessions.
    stop_grace_period: ${GR8_STOP_GRACE:-30s}
    volumes:
      # Model cache when MODEL is a Hugging Face URL (~164 GB for bit300, including the 102.4 GB NVMe PLE rowstore).
      # Keep this on fast local NVMe: Layer-1 PLE rows stream over O_DIRECT. Unset, a named volume. Set GR8_CACHE to a
      # local NVMe host directory, owned by uid 1000, to keep it outside docker.
      - ${GR8_CACHE:-cache}:/var/lib/gr8/cache
      # Optional pre-downloaded local model release directory (weights, manifests/exlr8-manifest-bit300.json, and
      # ple/exlr8-ple-L001.bin), mounted READ-ONLY. Set MODEL_DIR to the host path and MODEL=/var/lib/gr8/model in .env
      # to boot directly from a local download without touching the files.
      - ${MODEL_DIR:-model}:/var/lib/gr8/model:ro
      # Logs and state: out/ (supervisor.log, g6m4.r<N>.err, shim.log, front.log, gr8.state), and the S2 request
      # directory. Unset, a named volume.
      - ${GR8_HOME:-home}:/var/lib/gr8/home
    healthcheck:
      # Healthy once the supervisor reports serving and the API's /health answers 200 (`gr8 qw38 health`).
      # $$ leaves GR8_MODEL to the container's shell, which has the .env file's value, as the entrypoint does.
      test: ["CMD-SHELL", "exec /opt/gr8/gr8 \"$${GR8_MODEL}\" health"]
      interval: 30s
      timeout: 5s
      start_period: 30m
    # `gr8 qw38 down` exits 0 and the service stays down. Any other exit restarts the container.
    restart: on-failure

volumes:
  cache:
  home:
  model:
