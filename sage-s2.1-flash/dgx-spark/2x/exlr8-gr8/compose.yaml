# Sage-S2.1-Flash on two GB10 boxes (DGX Spark) at TP=2: gr8, the exlr8 k4 release, int4 KV, a prompt cache on disk.
# Run this file on both boxes with the same .env (PEERS: the two LAN addresses, head first). The head serves on port 8100.
name: sage-2x-spark
services:
  gr8:
    build:
      context: .
    image: ${IMAGE:-ghcr.io/kindlingai/sage-s2.1-flash-exlr8-2x-spark:latest}
    container_name: sage-2x-spark
    env_file:
      - path: .env
        required: false
    environment:
      - GR8_WORK_DIR=/var/lib/gr8/home
      - MODEL_CACHE=/var/lib/gr8/cache
    network_mode: host
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      core: 0
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    oom_score_adj: 1000
    init: true
    stop_grace_period: 30s
    volumes:
      - ${MODEL_CACHE_DIR:-cache}:/var/lib/gr8/cache
      - ${PROMPT_CACHE_DIR:-prompts}:/var/lib/gr8/prompts
      - ${GR8_HOME_DIR:-home}:/var/lib/gr8/home
    healthcheck:
      test: ["CMD", "/opt/sage-2x/bin/gr8", "glm53f", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60m
    restart: on-failure

volumes:
  cache:
  prompts:
  home:
