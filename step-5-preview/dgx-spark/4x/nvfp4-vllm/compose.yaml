# Step-5 Preview NVFP4 on 4x DGX Spark (GB10): upstream vLLM published image pinned by digest,
# with this recipe's .env and read-only FP8 KV overlay. No local Docker build.
# Serves the OpenAI API on port 8100 (host network) on NODE_RANK=0; ranks 1..3 run --headless.
#
#   cp .env.example .env          # set NODE_RANK (0..3), NODE0..NODE3, NETWORK_IFACE, RDMA_HCA
#   docker compose up -d          # start ranks 1, 2, 3 first, then rank 0
#   docker compose logs -f        # rank 0 is ready when 127.0.0.1:8100/v1/models answers
#
# Host prerequisites (run before docker compose up -d): copy/verify split weights across holders
# 0..2, export/mount read-only NFS, and build the /srv/step5/model symlink view (see README.md).
name: step5-tp4-gb10-recipe

services:
  vllm:
    # Upstream vLLM Step-5 Preview multi-arch OCI index (linux/arm64 GB10 manifest digest:
    # sha256:784f5812c03fe18b11e33a01ea04e063b31fc14bc0fb1a1109f908adcc0619d1).
    image: ${VLLM_IMAGE:-vllm/vllm-openai:step-5-preview@sha256:8bc189bb3f57183bcaf4f01405b29d4d92d782a182b384aac79b4b2885fb1fda}
    container_name: ${CONTAINER_PREFIX:-step5}-r${NODE_RANK:-0}
    entrypoint: ["/bin/bash", "/opt/step5-recipe/entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/cache
      - XDG_CACHE_HOME=/cache
      - HF_HOME=/cache/huggingface
      - STEP5_ROOT=${STEP5_ROOT:-/srv/step5}
      - NODE_RANK=${NODE_RANK:-0}
      - NODE0=${NODE0:-192.168.50.11}
      - NODE1=${NODE1:-192.168.50.12}
      - NODE2=${NODE2:-192.168.50.13}
      - NODE3=${NODE3:-192.168.50.14}
      - VLLM_HOST_IP=${VLLM_HOST_IP:-}
      - NCCL_SOCKET_IFNAME=${NETWORK_IFACE:-eth0}
      - GLOO_SOCKET_IFNAME=${NETWORK_IFACE:-eth0}
      - NCCL_IB_HCA=${RDMA_HCA:-mlx5_0,mlx5_1}
      - NCCL_CROSS_NIC=${NCCL_CROSS_NIC:-1}
      - NCCL_MIN_NCHANNELS=${NCCL_MIN_NCHANNELS:-2}
      - NCCL_MAX_NCHANNELS=${NCCL_MAX_NCHANNELS:-2}
      - API_PORT=${API_PORT:-8100}
      - MASTER_PORT=${MASTER_PORT:-29511}
      - PROFILE=${PROFILE:-b5-fp8}
    # Host networking: rank 0 serves the OpenAI API on port 8100 (configurable via API_PORT) and
    # all ranks communicate over the host RDMA fabric without NAT.
    network_mode: host
    ipc: host
    shm_size: 16g
    devices:
      - /dev/infiniband:/dev/infiniband
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
      core: 0
    oom_score_adj: 1000
    init: true
    stop_grace_period: ${STOP_GRACE:-30s}
    volumes:
      # Same absolute path inside the container preserves the symlink targets in ${STEP5_ROOT}/model.
      - ${STEP5_ROOT:-/srv/step5}:${STEP5_ROOT:-/srv/step5}:ro
      # Writable container cache (HF, Triton, inductor, CUDA graphs).
      - ${CACHE_DIR:-/var/cache/step5}:/cache
      # Read-only FP8 KV overlay + SHA256 manifest verified at start when STEP5_FP8KV=1.
      - ./fp8-kv:/opt/step5-fp8kv-bundle:ro
      # Read-only profile/rank entrypoint wrapper.
      - ./scripts/entrypoint.sh:/opt/step5-recipe/entrypoint.sh:ro
    healthcheck:
      # Rank 0 checks the OpenAI API on port 8100; headless workers check that vllm serve is up.
      test:
        [
          "CMD-SHELL",
          "if [ \"${NODE_RANK:-0}\" = \"0\" ]; then curl -sf http://127.0.0.1:${API_PORT:-8100}/v1/models > /dev/null; else pgrep -f 'vllm.*serve' > /dev/null; fi",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30m
    restart: on-failure
