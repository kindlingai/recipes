# <Model> on <count>× <hardware>: the engine's published image, pinned by tag and digest, with this recipe's .env.
# No engine is compiled here and there is no Dockerfile: the image runs exactly as published. Serves the OpenAI API
# on port 8100 (host network).
#
#   cp .env.example .env
#   docker compose up -d          # the first boot fetches the model
#   docker compose logs -f        # ready when the OpenAI API answers on 127.0.0.1:8100
#
# RULE (the launcher's): no option default lives here. The launcher in the image owns every default, and .env
# carries this recipe's settings. The only values set below are the container's own paths.
name: <id>
services:
  engine:
    # The engine pin: <engine repo> <ref> (<commit>); kindling.json "engine" names the same digest. Never a movable
    # tag alone, never a locally built image.
    image: ${ENGINE_IMAGE:-ghcr.io/kindlingai/<engine>:<tag>@sha256:<64-hex digest>}
    container_name: <id>
    # The launcher's options, from .env. Optional: options can also come on the command line of `run`.
    env_file:
      - path: .env
        required: false
    environment:
      # The container's own paths (the volumes below, the image's python and front end). Set here so a path meant for
      # a bare-metal box in .env cannot point the launcher somewhere that does not exist in the container.
      - <ENGINE>_WORK_DIR=/var/lib/<engine>/home
      - MODEL_CACHE=/var/lib/<engine>/cache
    # Host networking: the OpenAI API serves on 127.0.0.1:8100 with no port mapping. Control ports stay host ports
    # too, so the launcher sees any engine already on the box.
    network_mode: host
    # See one engine started outside the container in the host's process list.
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      # Pinned host buffers (the engine locks staged host memory).
      memlock: -1
      # A crash must not dump core: a rank holds the NVIDIA driver's lock the whole time it writes a core, which can
      # leave the box unreachable until a power cycle.
      core: 0
    # The engine runs with no more rights than it needs: the image's unprivileged uid, no capabilities but IPC_LOCK
    # (pinned memory), no privilege escalation, a read-only image with a private /tmp. Relax a line only when the
    # engine provably needs it, and say so here.
    cap_drop: [ALL]
    cap_add: [IPC_LOCK]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    # Under memory pressure the kernel ends the engine before sshd or the rest of the box.
    oom_score_adj: 1000
    # tini as PID 1: it forwards docker's SIGTERM to the launcher and reaps the engine and its shims.
    init: true
    # Match GR8-style stop grace to the engine's shutdown: long enough to flush state, and set a longer value in
    # .env (STOP_GRACE) when sessions persist across restarts.
    stop_grace_period: ${STOP_GRACE:-30s}
    volumes:
      # The model release plus the engine's cache. Keep this on fast local NVMe when the engine streams over
      # O_DIRECT. Unset, a named volume; set CACHE_DIR to a host directory owned by the image's uid to keep it
      # outside docker.
      - ${CACHE_DIR:-cache}:/var/lib/<engine>/cache
      # Logs and state. Unset, a named volume.
      - ${STATE_DIR:-state}:/var/lib/<engine>/home
      # Files the engine needs at run time (presets, manifests, kv-store config) are bind-mounted READ-ONLY from the
      # recipe folder, so a running container cannot change what it boots with:
      # - ./presets:/opt/<engine>/presets:ro
      # - ./manifests:/opt/<engine>/manifests:ro
    healthcheck:
      # Healthy once the OpenAI API answers on 127.0.0.1:8100. start_period covers the first model download.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8100/v1/models > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30m
    # `down` exits 0 and the service stays down. Any other exit restarts the container.
    restart: on-failure

volumes:
  cache:
  state:
